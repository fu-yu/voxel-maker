# main が変わるたびに、公開に必要なファイルだけを gh-pages ブランチに置く。
# 前提: main には、作業ブランチで確かめ終わった変更だけを取り込む (main に直接コミットしない)。
# GitHub Pages の公開元は gh-pages ブランチのルート。
name: Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 説明ページを組み立てる
        run: python3 tools/build_guide.py

      - name: 公開するファイルを集める
        run: |
          mkdir -p _site/docs/public
          cp index.html guide.html minecraft.html LICENSE _site/
          cp -R tried _site/
          cp -R docs/public/images _site/docs/public/
          touch _site/.nojekyll

      - name: gh-pages ブランチに置く
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "公開: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
